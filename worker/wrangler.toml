name = "oogatron"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "oogatron"
database_id = "PLACEHOLDER_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_KV_ID"
