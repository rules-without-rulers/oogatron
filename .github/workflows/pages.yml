name: Pages

# Publishes the "oogatron control room": the static harness + jumbotron
# module. Data defaults to the baked fixture (snapshot-first, zero required
# network); ?src=<worker url> still switches to live data.

on:
  push:
    branches: [rock]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r harness jumbotron _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=harness/">
          <title>oogatron</title>
          <a href="harness/">oogatron control room</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
